# SPDX-License-Identifier: LGPL-3.0-or-later
name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: rocky9
            image: rockylinux:9
          - distro: debian13
            image: debian:13
          - distro: arch
            image: archlinux:base
    env:
      PKG_CONFIG_PATH: /opt/qtspice-native/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/qtspice-native/lib
    steps:
      - name: Install Git and Node.js (Rocky)
        if: matrix.distro == 'rocky9'
        run: |
          dnf -y module enable nodejs:22
          dnf -y install git nodejs
      - name: Install Git and Node.js (Debian)
        if: matrix.distro == 'debian13'
        run: |
          apt-get update
          apt-get install -y git ca-certificates nodejs
      - name: Install Git and Node.js (Arch)
        if: matrix.distro == 'arch'
        run: pacman -Syu --noconfirm --needed git nodejs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: bash ci/install-deps.sh "${{ matrix.distro }}"
      - name: Build and test
        run: |
          chown -R builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash ci/validate.sh
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.distro }}
          path: build/Testing/
          if-no-files-found: warn
